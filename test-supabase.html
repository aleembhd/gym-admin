<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Supabase Connection Test</h1>
    <button onclick="testConnection()">Test Connection</button>
    <div id="result"></div>

    <script>
        const SUPABASE_URL = 'https://zibkfxmqglvmpuzaohky.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppYmtmeG1xZ2x2bXB1emFvaGt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTkyNTksImV4cCI6MjA5MzczNTI1OX0.sNMrQtwAKb7vceVMNNX3qDH0CA7ECri_gujwREIQQPQ';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing connection...</p>';

            try {
                // Test 1: Check if client is created
                console.log('Supabase client:', supabase);
                resultDiv.innerHTML += '<p>✅ Supabase client created</p>';

                // Test 2: Try to fetch from members table
                const { data, error } = await supabase
                    .from('members')
                    .select('*')
                    .limit(5);

                if (error) {
                    console.error('Error:', error);
                    resultDiv.innerHTML += `<p>❌ Error: ${error.message}</p>`;
                    resultDiv.innerHTML += `<p>Details: ${JSON.stringify(error, null, 2)}</p>`;
                } else {
                    console.log('Data:', data);
                    resultDiv.innerHTML += `<p>✅ Successfully fetched ${data.length} members</p>`;
                    resultDiv.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
            } catch (err) {
                console.error('Caught error:', err);
                resultDiv.innerHTML += `<p>❌ Caught error: ${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
