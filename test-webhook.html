<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Webhook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4F46E5;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background: #4338CA;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #F3F4F6;
        }
        .success {
            background: #D1FAE5;
            color: #065F46;
        }
        .error {
            background: #FEE2E2;
            color: #991B1B;
        }
        pre {
            background: white;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Webhook Test Tool</h1>
    <p>Test your n8n webhook integration</p>

    <button onclick="testWebhook()">🚀 Test Webhook</button>
    <button onclick="testCallButton()">📞 Test Call Button</button>

    <div id="result"></div>

    <script>
        const WEBHOOK_URL = 'https://rafibuildsexp.app.n8n.cloud/webhook/send-gym-confirmation';

        async function testWebhook() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>⏳ Sending request to webhook...</p>';

            const payload = {
                name: "Test Member",
                phone: "7878888888",
                amount: 1500,
                daysLeft: 30,
                dateOfJoining: "2026-05-10",
                timestamp: new Date().toISOString()
            };

            console.log('Sending payload:', payload);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                console.log('Response status:', response.status);
                const responseText = await response.text();
                console.log('Response body:', responseText);

                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3>✅ Success!</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Response:</strong></p>
                        <pre>${responseText || 'Empty response'}</pre>
                        <p><strong>Payload sent:</strong></p>
                        <pre>${JSON.stringify(payload, null, 2)}</pre>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}: ${responseText}`);
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p><strong>Message:</strong> ${error.message}</p>
                    <p><strong>Possible causes:</strong></p>
                    <ul>
                        <li>Webhook URL is incorrect</li>
                        <li>n8n workflow is not active</li>
                        <li>CORS is blocking the request</li>
                        <li>Network connection issue</li>
                    </ul>
                    <p><strong>Check browser console for more details</strong></p>
                `;
            }
        }

        function testCallButton() {
            const resultDiv = document.getElementById('result');
            const testPhone = '7878888888';
            
            resultDiv.innerHTML = `
                <h3>📞 Call Button Test</h3>
                <p>Click the button below to test the call functionality:</p>
                <a href="tel:${testPhone}" style="
                    display: inline-block;
                    background: #1F2937;
                    color: white;
                    padding: 12px 24px;
                    border-radius: 8px;
                    text-decoration: none;
                    margin: 10px 0;
                ">
                    📞 Call ${testPhone}
                </a>
                <p><strong>Expected behavior:</strong></p>
                <ul>
                    <li><strong>On Mobile:</strong> Opens phone dialer with number pre-filled</li>
                    <li><strong>On Desktop:</strong> Opens calling app (Skype, Teams, etc.) or shows prompt</li>
                </ul>
                <p><strong>Technical details:</strong></p>
                <pre>href="tel:${testPhone}"</pre>
            `;
        }
    </script>
</body>
</html>
